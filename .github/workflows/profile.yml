name: profile-assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  ascii-avatar:
    name: ascii avatar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow
      - name: Render avatar as ASCII
        run: python scripts/ascii_avatar.py --user ${{ github.repository_owner }} --out assets/ascii-avatar.svg --cols 88
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ascii-avatar.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh ascii avatar [skip ci]" && git push)

  crt-contrib:
    name: crt contribution chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate amber CRT SVGs
        uses: stefashkaa/github-profile-crt@v1
        with:
          github-user: ${{ github.repository_owner }}
          output-dir: assets
          themes: amber
          commit-and-push: "true"
          minify-svg: "true"

  terminal-stats:
    name: terminal identity card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Generate terminal card
        uses: yogeshwaran01/github-stats-terminal-style@master
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: gruvbox
          headerStyle: mac
          hostname: github.com
          typingSpeed: 60
          commands: whoami,top-repos,exit
          outputPath: assets/terminal-stats.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal-stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh terminal card [skip ci]" && git push)

  quote:
    name: rotate footer quote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update quote
        run: python scripts/quote.py --readme README.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: rotate quote [skip ci]" && git push)