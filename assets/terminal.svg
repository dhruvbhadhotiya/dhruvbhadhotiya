<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 460" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Terminal showing whoami, skills and recent commits">
<style>
:root{--bg:#0d0b07;--fg:#ffb000;--accent:#ffcc66;--dim:#a07f35;--chrome:#1a150c}
.bg{fill:var(--bg)}.chrome{fill:var(--chrome)}.fg{fill:var(--fg)}.hi{fill:var(--accent)}.dim{fill:var(--dim)}
.term{fill:var(--fg)}
@keyframes type{from{width:0}to{width:var(--w)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.reveal{animation:type .5s steps(24,end) both}
#cur{animation:blink 1.1s step-end infinite}
@media (prefers-color-scheme: light){:root{--bg:#fdf6e3;--fg:#8a4b00;--accent:#b35c00;--dim:#8a6a42;--chrome:#efe3c8}}
@media (prefers-reduced-motion: reduce){.reveal{animation:none;width:var(--w)}#cur{animation:none}}
</style>
