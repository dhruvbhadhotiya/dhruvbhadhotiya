, Arial, sans-serif" font-size="17" font-weight="400">I&apos;m a B.Tech (Hons.) Computer Science student specializing</text><text x="268" y="90" fill="#B6A79E" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">in AI &amp; Analytics, and an ML researcher at CSIR–Fourth</text><text x="268" y="116" fill="#B6A79E" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">Paradigm Institute.</text><text x="268" y="142" fill="#B6A79E" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">I work at the intersection of machine learning and security</text><text x="268" y="168" fill="#B6A79E" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">— graph neural networks, anomaly detection, and systems for</text><text x="268" y="194" fill="#B6A79E" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">the real world.</text><text x="268" y="220" fill="#B6A79E" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">I like turning research into working software — from</text><text x="268" y="246" fill="#B6A79E" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">OCR-to-LLM platforms to fully offline multimodal assistants.</text><line x1="48" y1="270" x2="1152" y2="270" stroke="url(#about-rule)" stroke-width="1" stroke-linecap="round" opacity="0.7"/><path d="M48 272 L88 272 L96 264 L160 264 L168 272 L208 272" fill="none" stroke="#7A6257" stroke-width="1" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="45.5" y="269.5" width="5" height="5"