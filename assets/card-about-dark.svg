<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="About — identity"><title>About — identity</title><defs><radialGradient id="about-grad"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45"/><stop offset="65%" stop-color="#06B6D4" stop-opacity="0.18"/><stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/></radialGradient><filter id="about-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter><linearGradient id="about-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient></defs><rect width="1200" height="330" fill="#0A0E1A"/><rect x="8" y="8" width="1184" height="314" rx="14" fill="#131A2A" stroke="#2A3550" stroke-width="1.25"/><circle cx="130" cy="160" r="86" fill="url(#about-grad)" filter="url(#about-blur)"/><circle cx="130" cy="160" r="72" fill="none" stroke="#2A3550" stroke-width="1.25"/><text x="130" y="200" fill="#F1F5F9" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="110" font-weight="400" text-anchor="middle" opacity="0.92">D</text><text x="268" y="74" fill="#94A3B8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">I&apos;m a B.Tech (Hons.) Computer Science student specializing</text><text x="268" y="100" fill="#94A3B8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">in AI &amp; Analytics, and an ML researcher at CSIR–Fourth</text><text x="268" y="126" fill="#94A3B8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">Paradigm Institute.</text><text x="268" y="152" fill="#94A3B8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">I work at the intersection of machine learning and security</text><text x="268" y="178" fill="#94A3B8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">— graph neural networks, anomaly detection, and systems for</text><text x="268" y="204" fill="#94A3B8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">the real world.</text><text x="268" y="230" fill="#94A3B8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">I like turning research into working software, from</text><text x="268" y="256" fill="#94A3B8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">OCR-to-LLM grading platforms to fully offline multimodal</text><text x="268" y="282" fill="#94A3B8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">assistants.</text><line x1="48" y1="246" x2="1152" y2="246" stroke="url(#about-rule)" stroke-width="1" stroke-linecap="round" opacity="0.5"/><text x="48" y="276" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="1.5">STUDYING</text><text x="48" y="304" fill="#F1F5F9" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">B.Tech CS · AI &amp; Analytics</text><line x1="306" y1="266" x2="306" y2="308" stroke="#2A3550" stroke-width="1"/><text x="324" y="276" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="1.5">UNIVERSITY</text><text x="324" y="304" fill="#F1F5F9" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">GLA University, Mathura</text><line x1="582" y1="266" x2="582" y2="308" stroke="#2A3550" stroke-width="1"/><text x="600" y="276" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="1.5">CGPA</text><text x="600" y="304" fill="#F1F5F9" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fon